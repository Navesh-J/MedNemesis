spring:
  application:
    name: mednemesis-backend

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.6-flash

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  port: ${PORT:8080}

mednemesis:
  upload:
    max-files: 10
    directory: uploads